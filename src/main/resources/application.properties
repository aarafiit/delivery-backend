spring.application.name=delivery-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=postgres
spring.datasource.password=12345678t
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# MinIO Object Storage Configuration
minio.storage.endpoint=http://localhost:9000
minio.storage.access-key=minioadmin
minio.storage.secret-key=minioadmin
minio.storage.bucket-name=delivery-backend
minio.storage.region=us-east-1
minio.storage.max-file-size=5242880
minio.storage.allowed-extensions=jpg,jpeg,png,pdf,gif

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
